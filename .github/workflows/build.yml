name: Build AI Core OS V2 Pro
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Build AI Core OS V2 Pro - Professional
        run: |
          rm -rf android .dart_tool build
          flutter create --platforms=android --project-name ai_core_os_v2_pro --org com.nawar.ai . --overwrite
          cat > pubspec.yaml << 'YAML'
          name: ai_core_os_v2_pro
          description: AI Core OS V2 Pro - Professional
          publish_to: 'none'
          version: 2.0.0+200
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            local_auth: 2.1.7
            flutter_tts: 4.2.3
            speech_to_text: 6.6.2
            shared_preferences: 2.3.2
            permission_handler: 11.3.1
            sqflite: 2.3.3+1
            path: 1.9.0
          flutter:
            uses-material-design: true
          YAML
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/compileSdk = 34/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion 34/targetSdkVersion 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk = 34/targetSdk = 35/g' android/app/build.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.10"/' android/settings.gradle || true
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-core-os-v2-pro
          path: build/app/outputs/flutter-apk/app-release.apk
