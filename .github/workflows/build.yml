name: Build AI Core OS V3 - Neural Engine
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Build V3 - Neural Engine
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec.yaml
          rm -rf android .dart_tool build
          flutter create --platforms=android --project-name ai_core_os_v3 --org com.nawar.ai . --overwrite
          rm -rf lib
          cp -r /tmp/lib_backup lib
          cp /tmp/pubspec.yaml pubspec.yaml
          ls -R lib | head -n 100
          sed -i 's/compileSdk = 34/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/targetSdk = 34/targetSdk = 35/g' android/app/build.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.1.10"/' android/settings.gradle || true
          flutter clean
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-core-os-v3-neural
          path: build/app/outputs/flutter-apk/app-release.apk
